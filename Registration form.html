<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Form</title>
    <style>
        body {
            background-image: url('intro-bg.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            font-size: xx-large;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 10px;
            padding: 10px;
        }

        form {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            width: 40%;
            margin: 0 auto;
            font-size: larger;
        }

        table {
            width: 100%;
        }

        td {
            padding: 10px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: larger;
        }

        button a {
            color: white;
            text-decoration: none;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <h1><b>Registration Form</b></h1>

    <form>
        <table>
            <tr>
                <td><label for="fname">First Name:</label></td>
                <td><input type="text" id="fname" name="fname"></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name:</label></td>
                <td><input type="text" id="lname" name="lname"></td>
            </tr>
            <tr>
                <td><label for="Cname">College Name:</label></td>
                <td><input type="text" id="Cname" name="Cname"></td>
            </tr>
            <tr>
                <td><label for="Age">Age:</label></td>
                <td><input type="text" id="Age" name="Age"></td>
            </tr>
            <tr>
                <td><label for="Contact">Contact:</label></td>
                <td><input type="text" id="Contact" name="Contact" placeholder="+91"></td>
            </tr>
            <tr>
                <td><label for="Gender">Choose Gender:</label></td>
                <td>
                    <select id="Gender" name="Gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <p><b>Choose your favourite course</b></p>
                    <input type="radio" id="Machine Learning" name="fav_course" value="Machine Learning">
                    <label for="Machine Learning">Machine Learning</label><br>
                    <input type="radio" id="Data Structures and Algorithm" name="fav_course" value="Data Structures and Algorithm">
                    <label for="Data Structures and Algorithm">Data Structures and Algorithm</label><br>
                    <input type="radio" id="Generative AI" name="fav_course" value="Generative AI">
                    <label for="Generative AI">Generative AI</label><br>
                    <input type="radio" id="Large Language Models" name="fav_course" value="Large Language Models">
                    <label for="Large Language Models">Large Language Models</label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit">Submit</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
